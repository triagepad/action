name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # The committed dist/ must never diverge from src/ under a given commit:
      # rebuild and fail if anything changed.
      - name: dist is in sync with src
        run: |
          npm run build
          git diff --exit-code dist/ || {
            echo "::error::dist/ is out of date — run 'npm run build' and commit dist/";
            exit 1;
          }
      - name: dry-run the action (fixtures only)
        run: npm run action:dryrun
